<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>脱敏记录 · Veil</title>
<style>
  :root {
    color-scheme: light dark;
    --v-bg: #f4f6fa; --v-surface: #ffffff; --v-surface-2: #f2f5f9; --v-text: #1f2933; --v-text-2: #52606d;
    --v-text-3: #8a94a6; --v-border: rgba(15, 23, 42, 0.1); --v-accent: #3b82f6; --v-accent-contrast: #ffffff;
    --v-danger: #e5484d; --v-warning: #d9822b; --v-success: #2f9e44; --v-radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --v-bg: #0f1218; --v-surface: #171b23; --v-surface-2: #1e232d; --v-text: #e6e9ef; --v-text-2: #b2bac7;
      --v-text-3: #7d8696; --v-border: rgba(255, 255, 255, 0.1); --v-accent: #5b9dff;
    }
  }
  /* Inside CPA-Manager-Plus, its theme wins. */
  html[data-cpamp-plugin-host] {
    --v-bg: var(--bg-secondary); --v-surface: var(--bg-primary); --v-surface-2: var(--bg-tertiary);
    --v-text: var(--text-primary); --v-text-2: var(--text-secondary); --v-text-3: var(--text-tertiary);
    --v-border: var(--border-color); --v-accent: var(--primary-color); --v-accent-contrast: var(--primary-contrast);
    --v-danger: var(--danger-color); --v-warning: var(--warning-color); --v-success: var(--success-color);
    --v-radius: var(--app-radius-md, 10px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--v-bg); color: var(--v-text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-bottom: 14px; }
  .title { display: flex; flex-direction: column; margin-right: 8px; min-width: 0; }
  .title h1 { font-size: 18px; margin: 0; line-height: 1.3; }
  .title span { color: var(--v-text-3); font-size: 12px; }
  .tabs { display: flex; gap: 4px; background: var(--v-surface-2); padding: 3px; border-radius: 9px; }
  .tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; cursor: pointer; color: var(--v-text-2); white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--v-surface); color: var(--v-text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--v-border); background: var(--v-surface); padding: 5px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--v-accent); }
  .btn.primary { background: var(--v-accent); border-color: var(--v-accent); color: var(--v-accent-contrast); }
  .btn.danger { color: var(--v-danger); }
  .btn.small { padding: 1px 9px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--v-surface); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
  .card > h2, .card-head h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; flex: 1; }
  .sub { color: var(--v-text-3); font-size: 12px; margin: -6px 0 10px; }
  .notice { border-left: 3px solid var(--v-warning); background: var(--v-surface); padding: 9px 12px; border-radius: 6px; margin-bottom: 14px; color: var(--v-text-2); }
  .notice.error { border-color: var(--v-danger); }
  .notice.ok { border-color: var(--v-success); }
  .muted { color: var(--v-text-3); }
  .small { font-size: 12px; }
  .hidden { display: none !important; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* kinds: secrets red, personal data orange, devices and networks blue, the user's own green */
  .g-secret { --kc: var(--v-danger); }
  .g-personal { --kc: var(--v-warning); }
  .g-device { --kc: var(--v-accent); }
  .g-custom { --kc: var(--v-success); }
  .kind { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: 500; }
  .kind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--kc, var(--v-text-3)); flex: none; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; font-size: 12px; line-height: 22px; background: var(--v-surface-2); color: var(--v-text-2); white-space: nowrap; }
  .tag.kc { background: color-mix(in srgb, var(--kc) 13%, transparent); color: var(--v-text); }
  .tag.mask { color: var(--v-accent); }
  .tag.warn { color: var(--v-warning); }
  .tag.block, .tag.stopped { color: var(--v-danger); }
  .tag.new { color: var(--v-success); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  /* A Placeholder or Stand-in stays recognizable in the safe context. */
  .ph { display: inline-block; padding: 0 5px; margin: 0 1px; border-radius: 4px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap;
        background: color-mix(in srgb, var(--kc, var(--v-accent)) 16%, transparent); color: var(--kc, var(--v-accent)); cursor: help; }
  .quote { background: var(--v-surface-2); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--v-text-2); }
  .quote .ph { display: inline; white-space: pre-wrap; overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* overview */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .stat { background: var(--v-surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .stat b { display: block; font-size: 24px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .stat .label { font-weight: 500; }
  .stat .note { color: var(--v-text-3); font-size: 12px; }
  .stat .note.bad { color: var(--v-warning); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .grid2 > .card { margin-bottom: 0; }
  .grid2 { margin-bottom: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding-top: 6px; }
  .bars div { flex: 1; min-width: 4px; background: var(--v-accent); opacity: .75; border-radius: 3px 3px 0 0; }
  .bars div:hover { opacity: 1; }
  .bars-x { display: flex; justify-content: space-between; gap: 3px; color: var(--v-text-3); font-size: 11px; margin-top: 4px; }
  .bars-x span { flex: 1; text-align: center; min-width: 0; overflow: hidden; }
  .bars-x.ends span { flex: none; }
  .share { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--v-border); }
  .share:last-child { border-bottom: 0; }
  .share .num { color: var(--v-text-2); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .share .meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--v-surface-2); overflow: hidden; }
  .share .meter i { display: block; height: 100%; background: var(--kc, var(--v-accent)); opacity: .7; }
  .share .why { grid-column: 1 / -1; color: var(--v-text-3); font-size: 12px; }
  .seen { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--v-border); }
  .seen:last-child { border-bottom: 0; }
  .seen .right { text-align: right; font-size: 12px; color: var(--v-text-2); white-space: nowrap; }

  /* records */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, input[type=text], input[type=password], textarea { background: var(--v-surface); border: 1px solid var(--v-border); border-radius: 7px; padding: 5px 8px; max-width: 100%; }
  textarea { width: 100%; min-height: 140px; resize: vertical; }
  .rec { display: block; border-bottom: 1px solid var(--v-border); padding: 10px 6px; cursor: pointer; border-radius: 6px; min-width: 0; }
  .rec:hover, .rec:focus-visible { background: var(--v-surface-2); outline: none; }
  .rec-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .rec-time { font-weight: 600; white-space: nowrap; }
  .rec-who { color: var(--v-text-3); font-size: 12px; }
  .rec-state { margin-left: auto; font-size: 12px; white-space: nowrap; color: var(--v-text-2); }
  .rec-state.bad { color: var(--v-danger); }
  .rec-sum { margin: 4px 0 2px; }
  .rec-glimpse { color: var(--v-text-3); font-size: 12.5px; }
  .list-foot { margin-top: 10px; display: flex; align-items: center; gap: 10px; }

  /* one record */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: flex-end; z-index: 10; }
  .panel { width: min(780px, 100%); height: 100%; overflow: auto; background: var(--v-bg); padding: 16px; box-shadow: -4px 0 18px rgba(0,0,0,.15); }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .panel-head h2 { flex: 1; font-size: 16px; margin: 0; min-width: 0; }
  .lead { font-size: 15px; margin: 0 0 10px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--v-text-2); font-size: 12.5px; }
  .facts span b { color: var(--v-text-3); font-weight: 400; margin-right: 4px; }
  .vcard { border: 1px solid var(--v-border); border-left: 3px solid var(--kc, var(--v-border)); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: var(--v-surface); }
  .vhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .vhead .kind { font-size: 15px; }
  .vhead .back { margin-left: auto; font-size: 12px; color: var(--v-success); white-space: nowrap; }
  .vhead .back.none { color: var(--v-text-3); }
  .vline { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 8px; margin-top: 8px; }
  .vline > b { color: var(--v-text-3); font-weight: 400; overflow-wrap: anywhere; }
  .vline > div { min-width: 0; }
  .original-value { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .context-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .context-pair > div { min-width: 0; }
  .context-pair .small { margin-bottom: 4px; }
  .ph.original { background: transparent; box-shadow: inset 0 -1px var(--kc, var(--v-accent)); }
  @media (max-width: 600px) {
    .context-pair, .vline { grid-template-columns: minmax(0, 1fr); }
    .vline { gap: 3px; }
  }
  details { margin-top: 10px; }
  details > summary { cursor: pointer; color: var(--v-accent); font-size: 13px; width: max-content; max-width: 100%; }
  details[open] > summary { margin-bottom: 6px; }
  .fp { background: var(--v-surface-2); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
  .fp h4 { margin: 10px 0 4px; font-size: 13px; }
  .fp h4:first-child { margin-top: 0; }
  .fp p { margin: 0 0 6px; color: var(--v-text-2); }
  .snippet { display: flex; align-items: flex-start; gap: 8px; }
  .snippet pre { flex: 1; min-width: 0; margin: 0; background: var(--v-surface); border: 1px solid var(--v-border); border-radius: 6px; padding: 6px 8px; overflow-x: auto; }
  .tech { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 12.5px; }
  .tech dt { color: var(--v-text-3); }
  .tech dd { margin: 0; overflow-wrap: anywhere; }
  .login { max-width: 420px; margin: 60px auto; }
  .login input { width: 100%; margin: 8px 0 12px; }

  @media (max-width: 640px) {
    .wrap { padding: 12px; }
    .tabs { order: 3; width: 100%; }
    .tabs button { flex: 1; padding: 5px 6px; }
    .actions { margin-left: auto; }
    .card { padding: 12px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat b { font-size: 20px; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .rec-top { flex-wrap: wrap; }
    .rec-state { margin-left: 0; }
    .panel { padding: 12px; }
    .vline { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card login hidden">
    <h2 data-t="loginTitle"></h2>
    <p class="muted" data-t="loginHint"></p>
    <div id="loginError" class="notice error hidden"></div>
    <label for="keyInput" data-t="managementKey"></label>
    <input id="keyInput" type="password" autocomplete="current-password">
    <button id="loginButton" class="btn primary" data-t="connect"></button>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="title"><h1 data-t="title"></h1><span data-t="tagline"></span></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="overview" data-t="tabOverview"></button>
        <button role="tab" data-tab="records" data-t="tabRecords"></button>
        <button role="tab" data-tab="preview" data-t="tabPreview"></button>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <button id="refresh" class="btn" data-t="refresh"></button>
        <button id="clear" class="btn danger" data-t="clear"></button>
      </div>
    </header>
    <div id="notices"></div>

    <section id="tab-overview">
      <div class="card">
        <div class="card-head">
          <h2 data-t="atAGlance"></h2>
          <select id="days" aria-label="range">
            <option value="1"></option><option value="7" selected></option><option value="30"></option>
          </select>
        </div>
        <div id="stats" class="stats"></div>
      </div>
      <div class="card"><h2 data-t="trend"></h2><div id="bars" class="bars"></div><div id="barsX" class="bars-x"></div></div>
      <div class="grid2">
        <div class="card"><h2 data-t="byKind"></h2><p class="sub" data-t="byKindSub"></p><div id="byKind"></div></div>
        <div class="card"><h2 data-t="byRule"></h2><p class="sub" data-t="byRuleSub"></p><div id="byRule"></div></div>
        <div class="card"><h2 data-t="byCaller"></h2><div id="byCaller"></div></div>
        <div class="card"><h2 data-t="byModel"></h2><div id="byModel"></div></div>
      </div>
      <div class="card"><h2 data-t="topValues"></h2><p class="sub" data-t="topValuesSub"></p><div id="topValues"></div></div>
    </section>

    <section id="tab-records" class="hidden">
      <div class="card">
        <div class="filters">
          <select id="fKind" aria-label="kind"></select>
          <select id="fCaller" aria-label="caller"></select>
          <select id="fModel" aria-label="model"></select>
          <select id="fAction" aria-label="action"></select>
          <label><input id="fStopped" type="checkbox"> <span data-t="onlyStopped"></span></label>
        </div>
        <div id="recordsList"></div>
        <div class="list-foot"><button id="more" class="btn hidden" data-t="more"></button><span id="listInfo" class="muted small"></span></div>
      </div>
    </section>

    <section id="tab-preview" class="hidden">
      <div class="card">
        <h2 data-t="previewTitle"></h2>
        <p class="muted" data-t="previewHint"></p>
        <textarea id="previewText"></textarea>
        <div style="margin:10px 0"><button id="previewRun" class="btn primary" data-t="previewRun"></button></div>
        <div id="previewOut"></div>
      </div>
    </section>
  </div>
</div>

<div id="detail" class="overlay hidden">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="panel-head"><h2 id="detailTitle"></h2><button id="detailClose" class="btn" data-t="close"></button></div>
    <div id="detailBody"></div>
  </div>
</div>

<script>

    return el("span", { class: "rec-state", text: parts.join(" · ") });
  }
  function renderRecords() {
    var list = clear(byId("recordsList"));
    if (!state.records.length) list.appendChild(el("p", { class: "muted", text: t("none") }));
    state.records.forEach(function (r) {
      var who = [callerName(r.caller), r.model].filter(Boolean).join(" · ");
      var open = function () { openDetail(r.key); };
      list.appendChild(el("div", { class: "rec", role: "button", tabindex: "0", onclick: open, onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } } },
        el("div", { class: "rec-top" }, el("span", { class: "rec-time", title: when(r.time), text: ago(r.time) }), el("span", { class: "rec-who ellipsis", text: who }), recordState(r)),
        r.values && r.values.length ? el("div", { class: "rec-sum" }, kindTags(r)) : null,
        r.glimpse ? el("div", { class: "rec-glimpse ellipsis" }, context(r.glimpse, valuesOf(r), true)) : null));
    });
    byId("more").classList.toggle("hidden", !state.more);
    byId("listInfo").textContent = state.records.length ? t("shown", fmt(state.records.length)) : "";
  }
  ["fKind", "fCaller", "fModel", "fAction", "fStopped"].forEach(function (id) { byId(id).addEventListener("change", function () { loadRecords(true); }); });
  byId("more").addEventListener("click", function () { loadRecords(false); });

  // ---- one record -------------------------------------------------------------------
  function copy(text, button) {
    var label = button.textContent;
    var done = function (ok) { button.textContent = t(ok ? "copied" : "copyFailed"); setTimeout(function () { button.textContent = label; }, 1500); };
    var fallback = function () {
      var area = el("textarea", { style: "position:fixed;top:0;left:0;opacity:0" });
      area.value = text;
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(area);
      done(ok);
    };
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); return; }
    } catch (e) {}
    fallback();
  }
  function snippet(yaml) {
    var button = el("button", { class: "btn small", type: "button", text: t("copy") });
    button.addEventListener("click", function () { copy(yaml, button); });
    return el("div", { class: "snippet" }, el("pre", { text: yaml }), button);
  }
  function veilYAML(lines) { return "plugins:\n  configs:\n    veil:\n" + lines.map(function (l) { return "      " + l; }).join("\n"); }
  // falsePositive tells how to stop a value being replaced, as far as the
  // page can tell without the value.
  function falsePositive(v) {
    var box = el("div", { class: "fp" }, el("p", { text: t("fpIntro") }));
    if (v.rule === "term") { box.appendChild(el("p", { text: t("fpTerm") })); return box; }
    if (v.rule === "known") box.appendChild(el("p", { text: t("fpKnown") }));
    if (v.rule === "secret-field") box.appendChild(el("p", { text: t("fpField") }));
    if (v.rule && !FIXED_RULES[v.rule]) {
      box.appendChild(el("h4", { text: t("fpRule") }));
      box.appendChild(el("p", { text: t("fpRuleText", ruleText(v.rule)[0]) }));
      box.appendChild(snippet(veilYAML(["disabled_rules:", "  - " + v.rule])));
    }
    box.appendChild(el("h4", { text: t("fpAllow") }));
    box.appendChild(el("p", { text: t("fpAllowText") }));
    box.appendChild(snippet(veilYAML(["allow:", "  - \"" + t("fillOriginal") + "\""])));
    if (v.action !== "warn") {
      box.appendChild(el("h4", { text: t("fpKind") }));
      box.appendChild(el("p", { text: t("fpKindText", kindName(v.kind)) }));
      box.appendChild(snippet(veilYAML(["actions:", "  " + v.kind + ": warn"])));
    }
    box.appendChild(el("p", { class: "muted", style: "margin-top:8px", text: t("fpTry") }));
    return box;
  }
  function line(label, content) { return el("div", { class: "vline" }, el("b", { text: label }), el("div", null, content)); }
  function valueCard(v, r, known, d) {
    var back = (r.restored && r.restored.back) || {};
    var rule = ruleText(v.rule);
    var head = el("div", { class: "vhead" }, kindLabel(v.kind), el("span", { class: "tag " + v.action, text: actionName(v.action) }),
      v.new ? el("span", { class: "tag new", title: t("newTip"), text: t("isNew") }) : null,
      r.restored && v.action === "mask" ? el("span", { class: "back" + (back[v.p] ? "" : " none"), text: back[v.p] ? t("vBack", fmt(back[v.p])) : t("vNoBack") }) : null);
    var card = el("div", { class: "vcard " + kindGroup(v.kind) }, head,
      el("div", { class: "muted small", style: "margin-top:2px", text: hint(v) + " · " + t("times", fmt(v.n)) }),
      line(t("tPlaceholder"), el("span", { class: "original-value", text: v.p })),
      line(t("vWhy"), el("span", null, el("b", { text: rule[0] }), lang === "zh" ? "：" : ": ", rule[1])),
      line(t("vWhere"), el("span", { title: (v.paths || []).join("\n"), text: places(v.paths) })));
    if (d.showOriginals) {
      var available = d.originals && Object.prototype.hasOwnProperty.call(d.originals, v.p);
      var original = available ? d.originals[v.p] : d.loadingOriginals ? t("originalsLoading") : r.stopped || v.action !== "mask" ? t("originalNotRetained") : t("originalUnavailable");
      card.appendChild(line(t("vOriginal"), el("div", { class: available ? "original-value" : "muted small", text: original })));
    }
    var snip = r.snips && r.snips[v.p];
    if (snip) {
      var preview = el("div", { class: "quote" }, context(snip, known, false));
      if (d.showOriginals && d.originals && Object.keys(d.originals).length) {
        card.appendChild(line(t("vContext"), el("div", { class: "context-pair" },
          el("div", null, el("div", { class: "muted small", text: t("originalContext") }), el("div", { class: "quote" }, context(snip, known, false, d.originals))),
          el("div", null, el("div", { class: "muted small", text: t("safeContext") }), preview))));
      } else card.appendChild(line(t("vContext"), preview));
    }
    var fp = el("details", null, el("summary", { text: t("fpTitle") }), falsePositive(v));
    var tech = el("details", null, el("summary", { text: t("techTitle") }), el("dl", { class: "tech" },
      el("dt", { text: t("tRule") }), el("dd", { class: "mono", text: v.rule || "—" }),
      el("dt", { text: t("tFields") }), el("dd", { class: "mono", style: "white-space:pre-wrap", text: (v.paths || []).join("\n") })));
    card.appendChild(fp);
    card.appendChild(tech);
    return card;
  }
  function openDetail(key) {
    closeDetail();
    var d = detail = { key: String(key), record: null, originals: null, showOriginals: false, loadingOriginals: false, valueRequest: 0, originalsError: false };
    call("record", { key: d.key }).then(function (r) {
      if (detail !== d) return;
      d.record = r;
      drawDetail();
      byId("detail").classList.remove("hidden");
      byId("detail").querySelector(".panel").scrollTop = 0;
    }).catch(function (e) { if (detail === d) { closeDetail(); failed(e); } });
  }
  function toggleOriginals(d) {
    var seq = ++d.valueRequest;
    d.showOriginals = !d.showOriginals;
    d.originals = null;
    d.originalsError = false;
    d.loadingOriginals = d.showOriginals;
    drawDetail();
    if (!d.showOriginals) return;
    call("record-values", { key: d.key }).then(function (result) {
      if (detail !== d || d.valueRequest !== seq) return;
      d.originals = result.values || {};
      d.loadingOriginals = false;
      drawDetail();
    }).catch(function (e) {
      if (detail !== d || d.valueRequest !== seq) return;
      d.originals = null;
      d.loadingOriginals = false;
      d.showOriginals = false;
      d.originalsError = true;
      if (e instanceof AuthError) failed(e);
      else drawDetail();
    });
  }
  function drawDetail() {
    var d = detail;
    if (!d || !d.record) return;
    var r = d.record;
    var focusOriginals = document.activeElement && document.activeElement.id === "originalsToggle";
    var body = clear(byId("detailBody"));
    byId("detailTitle").textContent = t("detailTitle", when(r.time));
    var values = r.values || [], known = valuesOf(r), back = (r.restored && r.restored.back) || {};

    var lead = el("div", { class: "card" });
    var masked = 0, maskedValues = 0, warned = 0;
    values.forEach(function (v) { if (v.action === "mask") { masked += v.n; maskedValues++; } else if (v.action === "warn") warned += v.n; });
    if (r.stopped) lead.appendChild(el("p", { class: "lead", text: t("leadStopped", stoppedText(r.stopped)) }));
    else {
      lead.appendChild(el("p", { class: "lead", text: t("leadMasked", { k: fmt(maskedValues), n: fmt(masked) }) + (warned ? " " + t("leadWarned", fmt(warned)) : "") }));
      lead.appendChild(el("p", { class: "muted", style: "margin:-4px 0 10px", text: !r.restored ? t("leadNoResp") : backCount(r) ? t("leadBack", fmt(backCount(r))) : t("leadBackNone") }));
    }
    var fact = function (label, text) { return el("span", null, el("b", { text: label }), text); };
    lead.appendChild(el("div", { class: "facts" },
      fact(t("fCaller"), callerName(r.caller)), fact(t("fModel"), r.model || "—"),
      fact(t("fFormat"), FORMATS[r.format] || r.format || "—"), fact(t("fTook"), took(r.took)), fact(t("fKey"), String(r.key))));
    body.appendChild(lead);

    var heading = el("div", { class: "card-head" }, el("h2", { text: t("whatTitle") }));
    var what = el("div", { class: "card" }, heading);
    if (!values.length) what.appendChild(el("p", { class: "muted", text: t("noValues") }));
    else {
      heading.appendChild(el("button", { id: "originalsToggle", class: "btn small", type: "button", "aria-pressed": String(d.showOriginals), text: d.showOriginals ? t("hideOriginals") : t("showOriginals"), onclick: function () { toggleOriginals(d); } }));
      what.appendChild(el("p", { class: "sub", text: t("originalsHint") }));
      if (d.loadingOriginals) what.appendChild(el("p", { class: "muted small", role: "status", text: t("originalsLoading") }));
      if (d.originalsError) what.appendChild(el("p", { class: "notice error", role: "alert", text: t("originalsFailed") }));
      if (d.showOriginals && !d.loadingOriginals) what.appendChild(el("p", { class: "sub", text: t("reconstructedContext") }));
      if (r.snips) what.appendChild(el("p", { class: "sub", style: "margin:-4px 0 10px", text: t("ctxNote") }));
      else what.appendChild(el("p", { class: "sub", style: "margin:-4px 0 10px", text: t("noSnip") }));
      values.forEach(function (v) { what.appendChild(valueCard(v, r, known, d)); });
    }
    body.appendChild(what);

    if (r.restored) {
      var others = Object.keys(back).filter(function (p) { return !known[p]; });
      var un = r.restored.unrestored || {}, unKeys = Object.keys(un).sort();
      if (others.length || unKeys.length) {
        var rs = el("div", { class: "card" });
        if (others.length) {
          rs.appendChild(el("p", { style: "margin:0 0 6px", text: t("otherBack") }));
          rs.appendChild(el("div", { class: "tags" }, others.sort().map(function (p) { return el("span", { class: "tag" }, context(p, {}, true), "×" + back[p]); })));
        }
        if (unKeys.length) {
          var total = 0;
          unKeys.forEach(function (p) { total += un[p]; });
          rs.appendChild(el("div", { class: "notice", style: "margin:" + (others.length ? "12px" : "0") + " 0 0" },
            el("b", { text: t("unrestoredTitle", fmt(total)) }), el("div", { class: "small", text: t("unrestoredText") }),
            el("div", { class: "tags", style: "margin-top:6px" }, unKeys.map(function (p) { return el("span", { class: "tag mono", text: p + " ×" + un[p] }); }))));
        }
        body.appendChild(rs);
      }
    }
    if (focusOriginals && byId("originalsToggle")) byId("originalsToggle").focus({ preventScroll: true });
  }
  function closeDetail() {
    if (detail) { detail.originals = null; detail.valueRequest++; }
    detail = null;
    clear(byId("detailBody"));
    byId("detail").classList.add("hidden");
  }
  byId("detailClose").addEventListener("click", closeDetail);
  byId("detail").addEventListener("click", function (e) { if (e.target === byId("detail")) closeDetail(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });
  window.addEventListener("pagehide", closeDetail);

  // ---- preview ----------------------------------------------------------------------
  byId("previewRun").addEventListener("click", function () {
    var text = byId("previewText").value;
    call("preview", null, { text: text }).then(function (r) {
      var out = clear(byId("previewOut"));
      if (r.truncated) out.appendChild(el("div", { class: "notice", text: t("truncated") }));
      var hits = r.hits || [];
      if (!hits.length) { out.appendChild(el("p", { class: "muted", text: t("previewNone") })); return; }
      var known = {};
      hits.forEach(function (h) { known[h.p] = h; });
      out.appendChild(el("div", { class: "quote", style: "margin-bottom:10px" }, context(r.text || "", known, false)));
      hits.forEach(function (h) {
        var rule = ruleText(h.rule);
        out.appendChild(el("div", { class: "vcard " + kindGroup(h.kind) },
          el("div", { class: "vhead" }, kindLabel(h.kind), el("span", { class: "tag " + h.action, text: actionName(h.action) })),
          el("div", { class: "muted small", style: "margin-top:2px", text: hint(h) + " · " + t("times", fmt(h.n)) }),
          line(t("vWhy"), el("span", null, el("b", { text: rule[0] }), lang === "zh" ? "：" : ": ", rule[1]))));
      });
    }).catch(failed);
  });

  // ---- refresh, clear ---------------------------------------------------------------
  function refresh() {
    return call("summary", { days: byId("days").value }).then(function (s) { state.summary = s; renderAll(); return loadRecords(true); }).catch(failed);
  }
  byId("refresh").addEventListener("click", function () { loadCallers().then(refresh); });
  byId("days").addEventListener("change", refresh);
  byId("clear").addEventListener("click", function () {
    if (!window.confirm(t("confirmClear"))) return;
    closeDetail();
    call("clear", null, {}).then(function () { return refresh(); }).then(function () { notice(t("cleared"), "ok"); }).catch(failed);
  });
  function failed(e) {
    if (e instanceof AuthError) { showLogin(t("loginFailed")); return; }
    notice(t("loadFailed", e && e.message ? e.message : String(e)), "error");
  }
  function renderAll() {
    renderNotices();
    renderOverview();
    renderFilters();
    renderRecords();
  }

  // ---- go ---------------------------------------------------------------------------
  applyLang();
  selectTab("overview");
  try {
    var root = window.parent !== window && parent.document.documentElement;
    if (root) new MutationObserver(applyLang).observe(root, { attributes: true, attributeFilter: ["lang"] });
  } catch (e) {}
  window.addEventListener("storage", function (e) { if (e.key === "cli-proxy-language") applyLang(); });
  var k = panelKey();
  if (k) start(k, true);
  else if (sessionKey()) start(sessionKey(), false);
  else showLogin("");
})();
</script>
</body>
</html>
