<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>脱敏记录 · Veil</title>
<style>
  :root {
    color-scheme: light dark;
    --v-bg: #f4f6fa; --v-surface: #ffffff; --v-surface-2: #f2f5f9; --v-text: #1f2933; --v-text-2: #52606d;
    --v-text-3: #8a94a6; --v-border: rgba(15, 23, 42, 0.1); --v-accent: #3b82f6; --v-accent-contrast: #ffffff;
    --v-danger: #e5484d; --v-warning: #d9822b; --v-success: #2f9e44; --v-radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --v-bg: #0f1218; --v-surface: #171b23; --v-surface-2: #1e232d; --v-text: #e6e9ef; --v-text-2: #b2bac7;
      --v-text-3: #7d8696; --v-border: rgba(255, 255, 255, 0.1); --v-accent: #5b9dff;
    }
  }
  /* Inside CPA-Manager-Plus, its theme wins. */
  html[data-cpamp-plugin-host] {
    --v-bg: var(--bg-secondary); --v-surface: var(--bg-primary); --v-surface-2: var(--bg-tertiary);
    --v-text: var(--text-primary); --v-text-2: var(--text-secondary); --v-text-3: var(--text-tertiary);
    --v-border: var(--border-color); --v-accent: var(--primary-color); --v-accent-contrast: var(--primary-contrast);
    --v-danger: var(--danger-color); --v-warning: var(--warning-color); --v-success: var(--success-color);
    --v-radius: var(--app-radius-md, 10px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--v-bg); color: var(--v-text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  .tabs { display: flex; gap: 4px; background: var(--v-surface-2); padding: 3px; border-radius: 9px; }
  .tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; cursor: pointer; color: var(--v-text-2); }
  .tabs button[aria-selected="true"] { background: var(--v-surface); color: var(--v-text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--v-border); background: var(--v-surface); padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .btn:hover { border-color: var(--v-accent); }
  .btn.primary { background: var(--v-accent); border-color: var(--v-accent); color: var(--v-accent-contrast); }
  .btn.danger { color: var(--v-danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--v-surface); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--v-text-2); font-weight: 600; }
  .notice { border-left: 3px solid var(--v-warning); background: var(--v-surface); padding: 9px 12px; border-radius: 6px; margin-bottom: 14px; color: var(--v-text-2); }
  .notice.error { border-color: var(--v-danger); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--v-surface-2); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--v-text-3); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--v-border); vertical-align: top; }
  th { color: var(--v-text-3); font-weight: 500; font-size: 12px; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--v-surface-2); }
  .muted { color: var(--v-text-3); }
  .badge { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12px; line-height: 20px; background: var(--v-surface-2); color: var(--v-text-2); margin: 1px 3px 1px 0; white-space: nowrap; }
  .badge.mask { color: var(--v-accent); }
  .badge.warn { color: var(--v-warning); }
  .badge.block, .badge.stopped { color: var(--v-danger); }
  .badge.new { color: var(--v-success); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding-top: 6px; }
  .bars div { flex: 1; min-width: 4px; background: var(--v-accent); opacity: .75; border-radius: 3px 3px 0 0; position: relative; }
  .bars div:hover { opacity: 1; }
  .bars-x { display: flex; justify-content: space-between; color: var(--v-text-3); font-size: 11px; margin-top: 4px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select, input[type=text], input[type=password], textarea { background: var(--v-surface); border: 1px solid var(--v-border); border-radius: 7px; padding: 5px 8px; }
  textarea { width: 100%; min-height: 140px; resize: vertical; }
  .snip { background: var(--v-surface-2); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-all; }
  .snip mark { background: color-mix(in srgb, var(--v-accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: flex-end; z-index: 10; }
  .panel { width: min(760px, 100%); height: 100%; overflow: auto; background: var(--v-bg); padding: 16px; box-shadow: -4px 0 18px rgba(0,0,0,.15); }
  .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .panel-head h2 { flex: 1; font-size: 16px; margin: 0; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
  .kv dt { color: var(--v-text-3); }
  .kv dd { margin: 0; word-break: break-all; }
  .login { max-width: 420px; margin: 60px auto; }
  .login input { width: 100%; margin: 8px 0 12px; }
  .hidden { display: none !important; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card login hidden">
    <h2 data-t="loginTitle"></h2>
    <p class="muted" data-t="loginHint"></p>
    <div id="loginError" class="notice error hidden"></div>
    <label for="keyInput" data-t="managementKey"></label>
    <input id="keyInput" type="password" autocomplete="current-password">
    <button id="loginButton" class="btn primary" data-t="connect"></button>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1 data-t="title"></h1>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="overview" data-t="tabOverview"></button>
        <button role="tab" data-tab="records" data-t="tabRecords"></button>
        <button role="tab" data-tab="preview" data-t="tabPreview"></button>
      </div>
      <div class="spacer"></div>
      <button id="refresh" class="btn" data-t="refresh"></button>
      <button id="clear" class="btn danger" data-t="clear"></button>
    </header>
    <div id="notices"></div>

    <section id="tab-overview">
      <div class="card">
        <div class="filters">
          <h2 style="margin:0" data-t="range"></h2>
          <select id="days">
            <option value="1"></option><option value="7" selected></option><option value="30"></option>
          </select>
        </div>
        <div id="stats" class="stats"></div>
      </div>
      <div class="card"><h2 data-t="trend"></h2><div id="bars" class="bars"></div><div id="barsX" class="bars-x"></div></div>
      <div class="grid2">
        <div class="card"><h2 data-t="byKind"></h2><div id="byKind"></div></div>
        <div class="card"><h2 data-t="byCaller"></h2><div id="byCaller"></div></div>
        <div class="card"><h2 data-t="byModel"></h2><div id="byModel"></div></div>
        <div class="card"><h2 data-t="byRule"></h2><div id="byRule"></div></div>
      </div>
      <div class="card"><h2 data-t="topValues"></h2><div class="scroll" id="topValues"></div></div>
    </section>

    <section id="tab-records" class="hidden">
      <div class="card">
        <div class="filters">
          <select id="fKind"></select>
          <select id="fCaller"></select>
          <select id="fModel"></select>
          <select id="fAction"></select>
          <label><input id="fStopped" type="checkbox"> <span data-t="onlyStopped"></span></label>
        </div>
        <div class="scroll"><table id="recordsTable"></table></div>
        <div style="margin-top:10px"><button id="more" class="btn hidden" data-t="more"></button> <span id="listInfo" class="muted"></span></div>
      </div>
    </section>

    <section id="tab-preview" class="hidden">
      <div class="card">
        <h2 data-t="previewTitle"></h2>
        <p class="muted" data-t="previewHint"></p>
        <textarea id="previewText"></textarea>
        <div style="margin:10px 0"><button id="previewRun" class="btn primary" data-t="previewRun"></button></div>
        <div id="previewOut"></div>
      </div>
    </section>
  </div>
</div>

<div id="detail" class="overlay hidden">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><h2 data-t="detailTitle"></h2><button id="detailClose" class="btn" data-t="close"></button></div>
    <div id="detailBody"></div>
  </div>
</div>

<script>

(function () {

  }
  function hostLang() {

    days[0].textContent = t("day1"); days[1].textContent = t("day7"); days[2].textContent = t("day30");
    if (state.ready) renderAll();
  }

  // ---- tiny DOM helpers ---------------------------------------------------
  function byId(id) { return document.getElementById(id); }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

  // CPA HTML-escapes every string a plugin's Management API answers with.

        H = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
      }
      h[0] = (h[0] + A) | 0; h[1] = (h[1] + B) | 0; h[2] = (h[2] + C) | 0; h[3] = (h[3] + D) | 0;

  }

  // ---- where the API is, and the key --------------------------------------
  var path = location.pathname, at = path.indexOf("/v0/resource/plugins/");
  var prefix = at >= 0 ? path.slice(0, at) : "";

  // The key CPA-Manager-Plus saves when "remember" is on: obfuscated, not

  function sessionKey() { try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; } }

  var state = { key: "", fromPanel: false, ready: false, summary: null, records: [], more: false, callers: {}, tab: "overview" };

  function AuthError() {}
  function request(url, opts) {
    opts = opts || {};

    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(url, { method: opts.method || "GET", headers: headers, body: opts.body, credentials: "same-origin", cache: "no-store" })

  }

  // ---- caller names --------------------------------------------------------
  function loadCallers() {

        var key = typeof k === "string" ? k : (k && (k["api-key"] || k.key || k.value)) || "";

    }).catch(function () {});
    return Promise.all([aliases, keys]).then(function () { state.callers = names; });
  }
  function callerName(scope) {
    if (!scope) return t("unknownCaller");
    var n = state.callers[scope];
    return n ? n.label : scope.slice(0, 8);
  }

  // ---- login ----------------------------------------------------------------

  }
  function start(key, fromPanel) {

    }).catch(function (e) {

  }
  byId("loginButton").addEventListener("click", function () {

  byId("keyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") byId("loginButton").click(); });

  // ---- notices, tabs ----------------------------------------------------------
  function notice(text, error) { byId("notices").appendChild(el("div", { class: "notice" + (error ? " error" : ""), text: text })); }
  function renderNotices() {
    var s = state.summary || {};

  }
  function selectTab(tab) {

    ["overview", "records", "preview"].forEach(function (n) { byId("tab-" + n).classList.toggle("hidden", n !== tab); });
  }
  each("[data-tab]", function (b) { b.addEventListener("click", function () { selectTab(b.getAttribute("data-tab")); }); });

  // ---- overview ----------------------------------------------------------------
  function shareTable(list, nameOf) {
    if (!list || !list.length) return el("p", { class: "muted", text: t("none") });
    var table = el("table", null, el("tr", null, el("th", { text: t("name") }), el("th", { class: "num", text: t("requests") }), el("th", { class: "num", text: t("count") }), el("th", { class: "num", text: t("distinct") })));
    list.slice(0, 12).forEach(function (c) {
      table.appendChild(el("tr", null, el("td", null, nameOf ? nameOf(c.name) : (c.name || "—")), el("td", { class: "num", text: fmt(c.requests) }), el("td", { class: "num", text: fmt(c.n) }), el("td", { class: "num", text: fmt(c.distinct) })));
    });

  }
  function hintText(v) {
    var parts = [];

    parts.push(t("chars", v.len));

  }
  function renderOverview() {
    var s = state.summary || {};
    var stats = clear(byId("stats"));
    [["requests", s.requests], ["places", s.n], ["distinct", s.distinct], ["warned", s.warned], ["stopped", s.stopped], ["restored", s.restored], ["unrestored", s.unrestored]].forEach(function (p) {
      stats.appendChild(el("div", { class: "stat" }, el("b", { text: fmt(p[1]) }), el("span", { text: t(p[0]) })));
    });
    var days = s.days || [], max = 1;
    days.forEach(function (d) { max = Math.max(max, d.requests || 0); });
    var bars = clear(byId("bars"));
    days.forEach(function (d) {
      var bar = el("div", { title: d.day + " · " + t("requests") + " " + fmt(d.requests) + " · " + t("places") + " " + fmt(d.n) });

      if (!d.requests) bar.style.opacity = ".2";
      bars.appendChild(bar);
    });
    var x = clear(byId("barsX"));
    if (days.length) { x.appendChild(el("span", { text: days[0].day })); x.appendChild(el("span", { text: days[days.length - 1].day })); }
    clear(byId("byKind")).appendChild(shareTable(s.kinds));
    clear(byId("byCaller")).appendChild(shareTable(s.callers, callerName));
    clear(byId("byModel")).appendChild(shareTable(s.models));
    clear(byId("byRule")).appendChild(shareTable(s.rules));
    var top = clear(byId("topValues"));
    if (!s.values || !s.values.length) { top.appendChild(el("p", { class: "muted", text: t("none") })); return; }
    var table = el("table", null, el("tr", null, el("th", { text: t("value") }), el("th", { text: t("kind") }), el("th", { text: t("hint") }), el("th", { text: t("rule") }), el("th", { class: "num", text: t("count") }), el("th", { class: "num", text: t("requests") }), el("th", { text: t("lastSeen") })));
    s.values.forEach(function (v) {
      table.appendChild(el("tr", null, el("td", null, el("code", { text: v.p })), el("td", null, el("span", { class: "badge", text: v.kind })), el("td", { text: hintText(v) }), el("td", { class: "muted", text: v.rule || "" }), el("td", { class: "num", text: fmt(v.n) }), el("td", { class: "num", text: fmt(v.requests) }), el("td", { class: "muted", text: when(v.last) })));
    });

  }

  // ---- records -------------------------------------------------------------------
  function fillSelect(id, allKey, items, labelOf) {
    var sel = byId(id), keep = sel.value;
    clear(sel).appendChild(el("option", { value: "", text: t(allKey) }));
    items.forEach(function (it) { sel.appendChild(el("option", { value: it, text: labelOf ? labelOf(it) : it })); });
    if (Array.prototype.some.call(sel.options, function (o) { return o.value === keep; })) sel.value = keep;
  }
  function renderFilters() {
    var s = state.summary || {};
    var names = function (list) { return (list || []).map(function (c) { return c.name; }); };
    fillSelect("fKind", "allKinds", names(s.kinds));
    fillSelect("fCaller", "allCallers", names(s.callers).map(function (c) { return "=" + c; }), function (v) { return callerName(v.slice(1)); });
    fillSelect("fModel", "allModels", names(s.models).filter(Boolean));
    fillSelect("fAction", "allActions", ["mask", "warn", "block"], function (a) { return t({ mask: "aMask", warn: "aWarn", block: "aBlock" }[a]); });
  }
  function query(before) {
    var q = { limit: "50" };
    if (before) q.before = String(before);
    if (byId("fKind").value) q.kind = byId("fKind").value;
    if (byId("fCaller").value) q.caller = byId("fCaller").value.slice(1);
    if (byId("fModel").value) q.model = byId("fModel").value;

    return q;
  }
  function loadRecords(reset) {
    var before = !reset && state.records.length ? state.records[state.records.length - 1].key : 0;
    return call("records", query(before)).then(function (r) {
      state.records = (reset ? [] : state.records).concat(r.records || []);
      state.more = !!r.more;
      renderRecords();
    }).catch(failed);
  }
  function actionBadge(a) { return el("span", { class: "badge " + a, text: t({ mask: "aMask", warn: "aWarn", block: "aBlock" }[a] || a) }); }
  function stoppedText(s) { return t({ block: "sBlock", malformed: "sMalformed", error: "sError" }[s] || s); }
  function restoredCount(r) {
    if (!r.restored) return "";
    var n = 0, back = r.restored.back || {};
    for (var p in back) n += back[p];
    return fmt(n);
  }
  function renderRecords() {
    var table = clear(byId("recordsTable"));
    table.appendChild(el("tr", null, el("th", { text: t("time") }), el("th", { text: t("caller") }), el("th", { text: t("model") }), el("th", { text: t("values") }), el("th", { class: "num", text: t("count") }), el("th", { class: "num", text: t("restored") })));
    if (!state.records.length) table.appendChild(el("tr", null, el("td", { colspan: "6", class: "muted", text: t("none") })));
    state.records.forEach(function (r) {
      var kinds = el("td");
      if (r.stopped) kinds.appendChild(el("span", { class: "badge stopped", text: stoppedText(r.stopped) }));
      var byKind = {};
      (r.values || []).forEach(function (v) { byKind[v.kind] = (byKind[v.kind] || 0) + v.n; });
      Object.keys(byKind).sort().forEach(function (k) { kinds.appendChild(el("span", { class: "badge", text: k + " ×" + byKind[k] })); });
      table.appendChild(el("tr", { class: "row", onclick: function () { openDetail(r.key); } },
        el("td", { class: "muted", text: when(r.time) }), el("td", { text: callerName(r.caller) }), el("td", { text: r.model || "—" }), kinds,
        el("td", { class: "num", text: fmt(r.n) }), el("td", { class: "num", text: restoredCount(r) })));
    });
    byId("more").classList.toggle("hidden", !state.more);
    byId("listInfo").textContent = state.records.length ? t("shown", fmt(state.records.length)) : "";
  }
  ["fKind", "fCaller", "fModel", "fAction", "fStopped"].forEach(function (id) { byId(id).addEventListener("change", function () { loadRecords(true); }); });
  byId("more").addEventListener("click", function () { loadRecords(false); });

  // ---- one record -------------------------------------------------------------------
  function marked(snip, placeholders) {
    var box = el("div", { class: "snip" });
    var rest = snip;
    while (rest.length) {
      var best = -1, which = "";
      placeholders.forEach(function (p) { var i = rest.indexOf(p); if (i >= 0 && (best < 0 || i < best)) { best = i; which = p; } });
      if (best < 0) { box.appendChild(document.createTextNode(rest)); break; }
      box.appendChild(document.createTextNode(rest.slice(0, best)));
      box.appendChild(el("mark", { text: which }));
      rest = rest.slice(best + which.length);
    }
    return box;
  }
  function openDetail(key) {
    call("record", { key: String(key) }).then(function (r) {
      var body = clear(byId("detailBody"));
      var kv = el("dl", { class: "kv" },
        el("dt", { text: t("time") }), el("dd", { text: when(r.time) }),
        el("dt", { text: t("caller") }), el("dd", { text: callerName(r.caller) + (r.caller ? "  (" + r.caller.slice(0, 16) + "…)" : "") }),
        el("dt", { text: t("model") }), el("dd", { text: r.model || "—" }),
        el("dt", { text: t("format") }), el("dd", { text: r.format || "—" }),
        el("dt", { text: t("took") }), el("dd", { text: t("micro", fmt(r.took)) }));
      if (r.stopped) { kv.appendChild(el("dt", { text: t("stopped") })); kv.appendChild(el("dd", null, el("span", { class: "badge stopped", text: stoppedText(r.stopped) }))); }
      body.appendChild(el("div", { class: "card" }, kv));

      var values = r.values || [], back = (r.restored && r.restored.back) || {};
      var vt = el("table", null, el("tr", null, el("th", { text: t("value") }), el("th", { text: t("kind") }), el("th", { text: t("hint") }), el("th", { text: t("action") }), el("th", { class: "num", text: t("count") }), el("th", { class: "num", text: t("restored") }), el("th", { text: t("paths") })));
      values.forEach(function (v) {
        vt.appendChild(el("tr", null,
          el("td", null, el("code", { text: v.p }), v.new ? el("span", { class: "badge new", text: t("isNew") }) : null),
          el("td", null, el("span", { class: "badge", text: v.kind }), el("div", { class: "muted", text: v.rule || "" })),
          el("td", { text: hintText(v) }), el("td", null, actionBadge(v.action)),
          el("td", { class: "num", text: fmt(v.n) }), el("td", { class: "num", text: back[v.p] ? fmt(back[v.p]) : "" }),
          el("td", { class: "mono muted", text: (v.paths || []).join(", ") })));
      });
      body.appendChild(el("div", { class: "card" }, el("h2", { text: t("values") }), values.length ? el("div", { class: "scroll" }, vt) : el("p", { class: "muted", text: t("noValues") }), el("p", { class: "muted", text: t("newNote") })));

      var snips = el("div", { class: "card" }, el("h2", { text: t("snips") }));
      var placeholders = values.map(function (v) { return v.p; }).sort(function (a, b) { return b.length - a.length; });
      if (r.snips) values.forEach(function (v) { if (r.snips[v.p]) { snips.appendChild(el("div", { class: "muted", text: v.kind + " " + v.p })); snips.appendChild(marked(r.snips[v.p], placeholders)); } });
      else if (values.length) snips.appendChild(el("p", { class: "muted", text: t("noSnips") }));
      body.appendChild(snips);

      var rs = el("div", { class: "card" }, el("h2", { text: t("restoredTitle") }));
      if (!r.restored) rs.appendChild(el("p", { class: "muted", text: t("noResponse") }));
      else {
        var list = el("div");
        Object.keys(back).sort().forEach(function (p) { list.appendChild(el("div", null, el("code", { text: p }), " ", el("span", { class: "muted", text: t("restoredPlaces", fmt(back[p])) }))); });
        if (!Object.keys(back).length) list.appendChild(el("p", { class: "muted", text: t("restoredPlaces", 0) }));
        rs.appendChild(list);
        var un = r.restored.unrestored || {};
        if (Object.keys(un).length) {
          rs.appendChild(el("h2", { style: "margin-top:12px", text: t("unrestoredTitle") }));
          Object.keys(un).sort().forEach(function (p) { rs.appendChild(el("div", null, el("code", { text: p }), " ×" + un[p])); });
        }
      }
      body.appendChild(rs);
      byId("detail").classList.remove("hidden");
    }).catch(failed);
  }
  byId("detailClose").addEventListener("click", function () { byId("detail").classList.add("hidden"); });
  byId("detail").addEventListener("click", function (e) { if (e.target === byId("detail")) byId("detail").classList.add("hidden"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") byId("detail").classList.add("hidden"); });

  // ---- preview ----------------------------------------------------------------------
  byId("previewRun").addEventListener("click", function () {
    var text = byId("previewText").value;
    call("preview", null, { text: text }).then(function (r) {
      var out = clear(byId("previewOut"));
      if (r.truncated) out.appendChild(el("div", { class: "notice", text: t("truncated") }));
      var hits = r.hits || [];
      if (!hits.length) { out.appendChild(el("p", { class: "muted", text: t("previewNone") })); return; }
      out.appendChild(marked(r.text || "", hits.map(function (h) { return h.p; }).sort(function (a, b) { return b.length - a.length; })));
      var table = el("table", { style: "margin-top:10px" }, el("tr", null, el("th", { text: t("value") }), el("th", { text: t("kind") }), el("th", { text: t("rule") }), el("th", { text: t("hint") }), el("th", { text: t("action") })));
      hits.forEach(function (h) { table.appendChild(el("tr", null, el("td", null, el("code", { text: h.p })), el("td", null, el("span", { class: "badge", text: h.kind })), el("td", { class: "muted", text: h.rule || "" }), el("td", { text: hintText(h) }), el("td", null, actionBadge(h.action)))); });
      out.appendChild(table);
    }).catch(failed);
  });

  // ---- refresh, clear ---------------------------------------------------------------
  function refresh() {
    return call("summary", { days: byId("days").value }).then(function (s) { state.summary = s; renderAll(); return loadRecords(true); }).catch(failed);
  }
  byId("refresh").addEventListener("click", function () { loadCallers().then(refresh); });
  byId("days").addEventListener("change", refresh);
  byId("clear").addEventListener("click", function () {
    if (!window.confirm(t("confirmClear"))) return;
    call("clear", null, {}).then(function () { return refresh(); }).then(function () { notice(t("cleared")); }).catch(failed);
  });
  function failed(e) {
    if (e instanceof AuthError) { showLogin(t("loginFailed")); return; }
    notice(t("loadFailed", e && e.message ? e.message : String(e)), true);
  }
  function renderAll() {
    renderNotices();
    renderOverview();
    renderFilters();
    renderRecords();
  }

  // ---- go ---------------------------------------------------------------------------
  applyLang();
  selectTab("overview");
  try {
    var root = window.parent !== window && parent.document.documentElement;
    if (root) new MutationObserver(applyLang).observe(root, { attributes: true, attributeFilter: ["lang"] });
  } catch (e) {}

})();
