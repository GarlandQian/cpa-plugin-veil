<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>脱敏记录 · Veil</title>
<style>
  :root {
    color-scheme: light dark;
    --v-bg: #f7f9fa; --v-surface: #fff; --v-surface-2: #f1f4f6;
    --v-text: #17232c; --v-text-2: #52616d; --v-text-3: #687985;
    --v-border: #e3e9ed; --v-accent: #147d72; --v-accent-contrast: #fff;
    --v-danger: #c84249; --v-warning: #a66b1b; --v-success: #19816c; --v-radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --v-bg: #111518; --v-surface: #191e22; --v-surface-2: #22292e;
      --v-text: #e8edf0; --v-text-2: #b5c1c9; --v-text-3: #93a2ad;
      --v-border: #30393f; --v-accent: #6ad5bf; --v-accent-contrast: #112b25;
      --v-danger: #f2868c; --v-warning: #dfb367; --v-success: #6ad5bf;
    }
  }
  /* Host colours retain their fallbacks if a panel omits a theme variable. */
  html[data-cpamp-plugin-host] {
    --v-bg: var(--bg-secondary, #111518); --v-surface: var(--bg-primary, #191e22); --v-surface-2: var(--bg-tertiary, #22292e);
    --v-text: var(--text-primary, #e8edf0); --v-text-2: var(--text-secondary, #b5c1c9); --v-text-3: var(--text-secondary, #a6b4be);
    --v-border: var(--border-color, #30393f); --v-accent: var(--primary-color, #6ad5bf); --v-accent-contrast: var(--primary-contrast, #112b25);
    --v-danger: var(--danger-color, #f2868c); --v-warning: var(--warning-color, #dfb367); --v-success: var(--success-color, #6ad5bf);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--v-bg); color: var(--v-text); font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--v-accent); outline-offset: 3px; }
  code, pre, .mono, .original-value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .wrap, .detail-wrap { max-width: 1240px; margin: 0 auto; padding: 30px 32px 48px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; flex: 1; }
  .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 1px solid color-mix(in srgb, var(--v-accent) 22%, var(--v-border)); border-radius: 13px; color: var(--v-accent); background: color-mix(in srgb, var(--v-accent) 7%, var(--v-surface)); }
  .brand-mark svg { width: 24px; height: 24px; }
  .title h1 { font-size: 22px; line-height: 1.3; letter-spacing: -.5px; margin: 0 0 3px; }
  .title span { color: var(--v-text-2); font-size: 13px; }
  .actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; border: 1px solid var(--v-border); background: var(--v-surface); padding: 6px 13px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: color-mix(in srgb, var(--v-accent) 50%, var(--v-border)); background: var(--v-surface-2); }
  .btn.primary { background: var(--v-accent); border-color: var(--v-accent); color: var(--v-accent-contrast); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { color: var(--v-text-2); }
  .btn.danger:hover { color: var(--v-danger); border-color: var(--v-danger); }
  .btn.small { min-height: 30px; font-size: 12.5px; padding: 3px 10px; }
  .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
  .navigation { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--v-border); margin-bottom: 26px; }
  .tabs { display: flex; gap: 24px; }
  .tabs button { position: relative; border: 0; background: none; color: var(--v-text-2); padding: 0 2px 13px; font-weight: 500; }
  .tabs button[aria-selected="true"] { color: var(--v-accent); }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--v-accent); border-radius: 2px; }
  .live-controls { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
  .live-toggle { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 0; color: var(--v-text-2); font-size: 12px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--v-text-3); }
  .live-toggle[data-active="true"] .live-dot { background: var(--v-success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--v-success) 12%, transparent); }
  .live-toggle.error .live-dot { background: var(--v-warning); box-shadow: none; }
  .updated { color: var(--v-text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .page-heading h2 { font-size: 18px; line-height: 1.4; margin: 0 0 5px; letter-spacing: -.25px; }
  .page-heading p { margin: 0; color: var(--v-text-2); font-size: 13px; }
  .count { display: inline-block; font-size: 12px; font-weight: 500; padding: 0 7px; border-radius: 5px; background: var(--v-surface-2); color: var(--v-text-2); margin-left: 8px; vertical-align: 2px; }
  .card { min-width: 0; background: var(--v-surface); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 22px; margin-bottom: 20px; }
  .card > h2, .card-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .card-head h2 { flex: 1; }
  .sub { color: var(--v-text-2); font-size: 12.5px; margin: 5px 0 18px; }
  .muted { color: var(--v-text-3); }
  .small { font-size: 12.5px; }
  .hidden { display: none !important; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .notice { border: 1px solid var(--v-border); border-left: 3px solid var(--v-warning); padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; color: var(--v-text-2); background: var(--v-surface); font-size: 13px; }
  .notice.error { border-left-color: var(--v-danger); }
  .notice.ok { border-left-color: var(--v-success); }
  #notices:empty { display: none; }
  .g-secret { --kc: var(--v-danger); }
  .g-personal { --kc: var(--v-warning); }
  .g-device { --kc: #739bdb; }
  .g-custom { --kc: var(--v-success); }
  .kind { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
  .kind::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--kc, var(--v-text-3)); flex: none; }
  .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 5px; padding: 1px 7px; font-size: 12px; line-height: 22px; background: var(--v-surface-2); color: var(--v-text-2); white-space: nowrap; }
  .tag.mask, .tag.new { color: var(--v-accent); }
  .tag.warn { color: var(--v-warning); }
  .tag.block, .tag.stopped { color: var(--v-danger); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .ph { display: inline; padding: 1px 3px; border-radius: 3px; font: inherit; background: color-mix(in srgb, var(--kc, var(--v-accent)) 12%, transparent); color: var(--kc, var(--v-accent)); overflow-wrap: anywhere; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .ph.original { background: transparent; box-shadow: inset 0 -1px var(--kc, var(--v-accent)); }
  .quote { border: 1px solid var(--v-border); background: var(--v-surface-2); border-radius: 8px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--v-text); font-size: 13px; line-height: 1.9; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 340px; padding: 48px 24px; }
  .empty-symbol { display: grid; place-items: center; width: 60px; height: 60px; color: var(--v-accent); background: color-mix(in srgb, var(--v-accent) 7%, var(--v-surface)); border: 1px solid color-mix(in srgb, var(--v-accent) 16%, var(--v-border)); border-radius: 18px; margin-bottom: 20px; }
  .empty-symbol .icon { width: 28px; height: 28px; }
  .empty h3 { font-size: 19px; margin: 0 0 9px; font-weight: 600; letter-spacing: -.3px; }
  .empty p { max-width: 430px; color: var(--v-text-2); margin: 0 0 22px; }
  .empty .btn { min-height: 38px; }
  .empty-flow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 28px; color: var(--v-text-3); font-size: 12px; }
  .empty-flow .icon { width: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--v-border); background: var(--v-surface); border-radius: var(--v-radius); margin-bottom: 20px; overflow: hidden; }
  .stats.has-warnings { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { padding: 20px 24px; min-width: 0; border-right: 1px solid var(--v-border); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-size: 30px; font-weight: 600; line-height: 1.4; letter-spacing: -.7px; margin: 5px 0 3px; font-variant-numeric: tabular-nums; }
  .stat .label { color: var(--v-text-2); font-size: 13px; }
  .stat .note { color: var(--v-text-3); font-size: 12px; }
  .stat .note.bad { color: var(--v-warning); }
  .overview-main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; }
  .overview-main .card { margin-bottom: 20px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--v-border); }
  .bars div { flex: 1; min-width: 0; background: color-mix(in srgb, var(--v-accent) 65%, var(--v-surface-2)); border-radius: 4px 4px 0 0; }
  .bars div:hover { background: var(--v-accent); }
  .bars-x { display: flex; justify-content: space-between; gap: 8px; color: var(--v-text-3); font-size: 11px; margin-top: 10px; }
  .bars-x span { flex: 1; text-align: center; min-width: 0; overflow: hidden; }
  .bars-x.ends span { flex: none; }
  .share { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--v-border); }
  .share:last-child { border-bottom: 0; padding-bottom: 0; }
  .share .num { color: var(--v-text-2); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
  .share .meter { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--v-surface-2); overflow: hidden; }
  .share .meter i { display: block; height: 100%; background: var(--kc, var(--v-accent)); opacity: .8; }
  .share .why { grid-column: 1 / -1; color: var(--v-text-3); font-size: 12px; }
  .seen { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 16px; padding: 14px 0; border-bottom: 1px solid var(--v-border); }
  .seen:last-child { border-bottom: 0; }
  .seen .right { text-align: right; font-size: 12px; color: var(--v-text-2); }
  .record-shell { padding: 0; overflow: hidden; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--v-border); }
  .filter-label { display: flex; align-items: center; gap: 7px; margin-left: auto; color: var(--v-text-2); font-size: 13px; white-space: nowrap; }
  select, input[type=text], input[type=password], textarea { background: var(--v-surface); border: 1px solid var(--v-border); border-radius: 7px; padding: 6px 10px; max-width: 100%; }
  select { min-height: 36px; }
  .filters select { min-width: 125px; max-width: 220px; flex: 1; }
  input[type=checkbox] { accent-color: var(--v-accent); }
  textarea { width: 100%; min-height: 185px; padding: 16px; resize: vertical; line-height: 1.8; }
  .records-head, .rec { display: grid; grid-template-columns: 115px minmax(0, 1fr) minmax(145px, .65fr) minmax(140px, .65fr) 18px; gap: 20px; align-items: center; }
  .records-head { padding: 11px 22px; border-bottom: 1px solid var(--v-border); color: var(--v-text-3); font-size: 12px; background: color-mix(in srgb, var(--v-surface-2) 50%, var(--v-surface)); }
  .rec { border-bottom: 1px solid var(--v-border); padding: 19px 22px; cursor: pointer; min-width: 0; }
  .rec:last-child { border-bottom: 0; }
  .rec:hover, .rec:focus-visible { background: color-mix(in srgb, var(--v-accent) 3%, var(--v-surface)); }
  .rec > div { min-width: 0; }
  .rec-time { font-variant-numeric: tabular-nums; font-weight: 500; }
  .rec-date { color: var(--v-text-3); font-size: 12px; }
  .rec-who { font-weight: 500; }
  .rec-model { color: var(--v-text-2); font-size: 12px; }
  .rec-state { color: var(--v-text-3); font-size: 12px; }
  .rec-state.good { color: var(--v-success); }
  .rec-state.bad { color: var(--v-danger); }
  .rec-inline-state { display: none; }
  .rec-glimpse { color: var(--v-text-2); font-size: 12px; margin-top: 5px; max-width: 100%; }
  .rec-glimpse .ph { color: inherit; background: none; padding: 0; }
  .rec-chevron { color: var(--v-text-3); }
  .list-foot { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px; border-top: 1px solid var(--v-border); }
  .new-records { width: 100%; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--v-border); color: var(--v-accent); background: color-mix(in srgb, var(--v-accent) 6%, var(--v-surface)); font-size: 13px; }
  .preview-card { max-width: 900px; }
  .preview-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
  .preview-note { color: var(--v-text-3); font-size: 12px; }
  #previewOut:not(:empty) { border-top: 1px solid var(--v-border); margin-top: 24px; padding-top: 24px; }
  .detail-open > .wrap { display: none; }
  .detail-wrap { display: block; }
  .panel { min-width: 0; }
  .panel-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 14px; background: var(--v-bg); padding: 12px 0 18px; margin: -12px 0 10px; border-bottom: 1px solid var(--v-border); }
  .panel-head h2 { flex: 1; font-size: 14px; font-weight: 500; color: var(--v-text-2); margin: 0; }
  .detail-navigation { display: flex; gap: 6px; }
  .detail-navigation .btn { width: 34px; padding: 5px; }
  .request-summary { padding: 22px 24px; }
  .detail-route { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 12px; }
  .detail-route strong { font-size: 19px; letter-spacing: -.3px; }
  .detail-route .icon { color: var(--v-text-3); width: 15px; }
  .lead { font-size: 14px; margin: 0 0 8px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 24px; padding-top: 15px; margin-top: 16px; border-top: 1px solid var(--v-border); color: var(--v-text-2); font-size: 12px; }
  .facts span b { color: var(--v-text-3); font-weight: 400; margin-right: 8px; }
  .detail-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 25px 0 15px; }
  .detail-toolbar h2 { font-size: 17px; margin: 0; }
  .detail-toolbar p { margin: 3px 0 0; color: var(--v-text-2); font-size: 12px; }
  .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .context-card { padding: 0; overflow: hidden; }
  .context-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--v-border); }
  .context-header .mono { color: var(--v-text-3); font-size: 11px; overflow-wrap: anywhere; }
  .context-text { padding: 22px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 2; }
  .context-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .context-pair > div { min-width: 0; }
  .context-pair > div + div { border-left: 1px solid var(--v-border); }
  .context-pair .context-label { padding: 11px 18px; background: var(--v-surface-2); border-bottom: 1px solid var(--v-border); color: var(--v-text-2); font-size: 12px; }
  .context-foot { color: var(--v-text-3); font-size: 12px; padding: 0 18px 15px; }
  .context-stack.picking .ph:not(.lit) { opacity: .4; }
  .context-stack .ph.lit { outline: 1px solid var(--kc, var(--v-accent)); outline-offset: 2px; }
  .value-aside { display: flex; flex-direction: column; gap: 10px; }
  .value-aside > h3 { font-size: 13px; color: var(--v-text-2); margin: 0 0 3px; font-weight: 500; }
  .vcard { min-width: 0; border: 1px solid var(--v-border); border-radius: 9px; padding: 16px; background: var(--v-surface); margin-bottom: 14px; }
  .value-aside .vcard { margin: 0; }
  .vcard.selected { border-color: color-mix(in srgb, var(--kc) 65%, var(--v-border)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--kc) 20%, transparent); }
  .value-select { display: block; width: 100%; padding: 0; background: none; border: 0; color: inherit; text-align: left; }
  .vhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .vhead .kind { flex: 1; }
  .value-hint { font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--v-text-2); margin: 11px 0 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .value-placeholder { font-size: 11.5px; color: var(--v-accent); overflow-wrap: anywhere; }
  .value-original { margin: 12px 0; border-top: 1px solid var(--v-border); padding-top: 10px; }
  .value-original .small { margin-bottom: 4px; }
  .original-value { white-space: pre-wrap; overflow-wrap: anywhere; }
  .value-meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 12px 0 0; font-size: 12px; }
  .value-meta dt { color: var(--v-text-3); }
  .value-meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--v-text-2); }
  .vline { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 10px; margin-top: 8px; font-size: 13px; }
  .vline > b { color: var(--v-text-3); font-weight: 400; overflow-wrap: anywhere; }
  .vline > div { min-width: 0; }
  details { margin-top: 14px; }
  details > summary { cursor: pointer; color: var(--v-text-2); font-size: 12px; }
  details[open] > summary { margin-bottom: 10px; }
  .fp { background: var(--v-surface-2); border-radius: 6px; padding: 12px; font-size: 12px; }
  .fp h4 { margin: 14px 0 5px; font-size: 12px; }
  .fp p { margin: 0 0 8px; color: var(--v-text-2); }
  .snippet { display: flex; align-items: flex-start; gap: 8px; }
  .snippet pre { flex: 1; min-width: 0; margin: 0; background: var(--v-surface); border: 1px solid var(--v-border); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 11px; }
  .tech { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; font-size: 12px; }
  .tech dt { color: var(--v-text-3); }
  .tech dd { margin: 0; overflow-wrap: anywhere; }
  .login { max-width: 440px; margin: 12vh auto; padding: 30px; }
  .login input { width: 100%; margin: 8px 0 20px; }
  @media (max-width: 1000px) {
    .records-head, .rec { grid-template-columns: 90px minmax(0, 1fr) minmax(130px, .6fr) 18px; gap: 16px; }
    .records-head .response-col, .rec .response-col { display: none; }
    .rec-inline-state { display: block; margin-top: 5px; }
    .detail-grid { grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; }
    .context-pair { grid-template-columns: minmax(0, 1fr); }
    .context-pair > div + div { border-left: 0; border-top: 1px solid var(--v-border); }
    .stat { padding: 18px; }
  }
  @media (max-width: 720px) {
    .wrap, .detail-wrap { padding: 20px 16px 32px; }
    header { flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .title h1 { font-size: 20px; }
    .title span { font-size: 12px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 10px; }
    .actions { width: 100%; justify-content: flex-end; }
    .navigation { flex-wrap: wrap; gap: 12px; }
    .tabs { gap: 24px; }
    .live-controls { width: 100%; justify-content: space-between; }
    .overview-main, .grid2, .detail-grid { grid-template-columns: minmax(0, 1fr); }
    .stats, .stats.has-warnings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--v-border); }
    .stat b { font-size: 27px; }
    .filters { padding: 14px; gap: 8px; }
    .filters select { min-width: 0; width: calc(50% - 4px); flex: auto; max-width: none; }
    .filter-label { margin: 3px 0 0; flex: 1; }
    .records-head { display: none; }
    .rec { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 17px 16px; }
    .rec-clock { grid-column: 1; display: flex; align-items: baseline; gap: 8px; }

    .page-heading { align-items: flex-start; }

    .context-text { padding: 18px; }
    .value-aside { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .preview-actions { align-items: flex-start; }
  }
  @media (max-width: 460px) {
    .value-aside { grid-template-columns: minmax(0, 1fr); }

    .detail-navigation .btn { width: 30px; }
    .detail-route strong { font-size: 17px; }
    .facts { gap: 7px 14px; }
  }

    <label for="keyInput" data-t="managementKey"></label>

        <button id="clear" class="btn ghost danger" data-t="clear"></button>

    <div class="navigation">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="records" data-t="tabRecords" aria-controls="tab-records"></button>
        <button role="tab" data-tab="overview" data-t="tabOverview" aria-controls="tab-overview"></button>

      <div class="live-controls">
        <span id="updated" class="updated"></span>
        <button id="liveToggle" class="live-toggle" type="button" aria-pressed="true"><span class="live-dot"></span><span id="liveLabel" class="live-label"></span></button>
      </div>

    <div id="notices"></div>

    <section id="tab-records" role="tabpanel">
      <div class="page-heading"><div><h2><span data-t="tabRecords"></span><span id="recordCount" class="count"></span></h2><p data-t="requestsHint"></p></div></div>

        <div id="filters" class="filters">

          <select id="fModel" aria-label="model"></select>
          <select id="fAction" aria-label="action"></select>

        <div id="listFoot" class="list-foot"><button id="more" class="btn small hidden" data-t="more"></button><span id="listInfo" class="muted small"></span></div>
      </div>

    <section id="tab-overview" class="hidden" role="tabpanel">
      <div class="page-heading"><div><h2 data-t="atAGlance"></h2><p data-t="overviewHint"></p></div><select id="days" aria-label="range"><option value="1"></option><option value="7" selected></option><option value="30"></option></select></div>

          <div class="card"><h2 data-t="trend"></h2><div id="bars" class="bars"></div><div id="barsX" class="bars-x"></div></div>

          <div class="card"><h2 data-t="byModel"></h2><div id="byModel"></div></div>
        </div>
        <details class="card" id="overviewRules"><summary data-t="byRule"></summary><p class="sub" data-t="byRuleSub"></p><div id="byRule"></div></details>
        <div class="card"><h2 data-t="topValues"></h2><p class="sub" data-t="topValuesSub"></p><div id="topValues"></div></div>
      </div>
    </section>

    <section id="tab-preview" class="hidden" role="tabpanel">
      <div class="page-heading"><div><h2 data-t="previewTitle"></h2><p data-t="previewHint"></p></div></div>

</section>
